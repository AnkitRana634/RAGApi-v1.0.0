name: Build and Push

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name RAGApi --expose-token

      - name: Build Docker Image
        run: |
          docker build \
            -t RAGApi.azurecr.io/ragapi:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push \
            RAGApi.azurecr.io/ragapi:${{ github.sha }}
