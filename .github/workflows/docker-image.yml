name: Build and Push

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect repository
        run: |
            echo "================================"
            echo "Current directory"
            echo "================================"
            pwd
            
            echo "================================"
            echo "Workspace"
            echo "================================"
            echo "$GITHUB_WORKSPACE"
            
            echo "================================"
            echo "Repository root"
            echo "================================"
            ls -la
            
            echo "================================"
            echo "All CSProj files"
            echo "================================"
            find "$GITHUB_WORKSPACE" -type f -name "*.csproj" -print
            
            echo "================================"
            echo "All Dockerfiles"
            echo "================================"
            find "$GITHUB_WORKSPACE" -type f -iname "Dockerfile" -print
            
            echo "================================"
            echo "RAGApi directory"
            echo "================================"
            ls -la "$GITHUB_WORKSPACE/RAGApi" || true
            
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIAL }}

      - name: Login to ACR
        run: az acr login --name RAGApi --expose-token

      - name: Build Docker Image
        run: docker build -f RAGApi/Dockerfile -t ragapi.azurecr.io/ragapi:${{ github.sha }} .

      - name: Push Docker Image
        run:  docker push RAGApi.azurecr.io/ragapi:${{ github.sha }}
